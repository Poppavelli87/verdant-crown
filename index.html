<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Verdant Crown is a web-based adaptive mythic RPG set between Thornmere and the Hollow Scar." />
    <meta property="og:title" content="Verdant Crown" />
    <title>Verdant Crown</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
      }

      body {
        display: grid;
        place-items: center;
      }

      #game-canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="RPG game canvas"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
